[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthbench"
version = "1.0.0"
description = "A makeability benchmark for synthesizability scores, built from reference sets of known provenance"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Harshita Tiwari" }]
keywords = ["cheminformatics", "synthesizability", "synthetic accessibility",
            "retrosynthesis", "benchmark", "de novo design"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "scikit-learn>=1.0",
]

[project.optional-dependencies]
rdkit = ["rdkit>=2022.9"]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/harshuharshu/synthbench"
Source = "https://github.com/harshuharshu/synthbench"

[tool.setuptools.packages.find]
include = ["synthbench*"]

[tool.setuptools.package-data]
"synthbench.data" = ["*.csv.gz"]
